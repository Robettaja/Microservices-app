resolver 127.0.0.11 valid=10s ipv6=off;
server { 
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /shortener {
        try_files /shortener.html =404;
    }

    location / { 
        try_files $uri $uri/ @redirect;
    }

    location /url_shortener/ {
        proxy_pass http://url_shortener:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @redirect {
        set $redirect_service url_redirect:7777;
        rewrite ^/(.*)$ /s/$1 break;
        proxy_pass http://$redirect_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}    